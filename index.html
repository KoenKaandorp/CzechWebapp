<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2E5E4E" />
  <title>Czech Flash</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

  <main class="app">
    <div id="view-learn"    class="view"></div>
    <div id="view-verbs"    class="view" hidden></div>
    <div id="view-lists"    class="view" hidden></div>
    <div id="view-stats"    class="view" hidden></div>
    <div id="view-settings" class="view" hidden></div>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button class="tabbar__btn is-active" data-tab="learn" aria-current="page">
      <span class="tabbar__icon" aria-hidden="true">●</span>
      <span class="tabbar__label">Words</span>
    </button>
    <button class="tabbar__btn" data-tab="verbs" aria-current="false">
      <span class="tabbar__icon" aria-hidden="true">V</span>
      <span class="tabbar__label">Verbs</span>
    </button>
    <button class="tabbar__btn" data-tab="lists" aria-current="false">
      <span class="tabbar__icon" aria-hidden="true">≡</span>
      <span class="tabbar__label">Lists</span>
    </button>
    <button class="tabbar__btn" data-tab="stats" aria-current="false">
      <span class="tabbar__icon" aria-hidden="true">▤</span>
      <span class="tabbar__label">Stats</span>
    </button>
    <button class="tabbar__btn" data-tab="settings" aria-current="false">
      <span class="tabbar__icon" aria-hidden="true">⚙</span>
      <span class="tabbar__label">Settings</span>
    </button>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
